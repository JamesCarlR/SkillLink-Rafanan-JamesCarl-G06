{% extends 'base.html' %}

{% block content %}
<div class="page">
  <div class="card auth" style="text-align: center;">
    <h2 style="color: #e53e3e;">Delete Skill</h2>
    <p class="sub">Are you sure you want to delete "<strong>{{ object.title }}</strong>"?</p>
    <p style="color: #e53e3e; font-size: 0.9rem; margin-bottom: 20px;">This action cannot be undone.</p>

    <form method="POST">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary" style="background: #e53e3e;">Yes, Delete It</button>
      <a href="{% url 'skill-list' %}" class="cancel">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
