{% extends 'base.html' %}

{% block content %}
<div class="page">
  <div class="card auth" style="max-width: 500px;">
    <h2>Post a New Skill</h2>
    <p class="sub">Fill out the details below to add to the board.</p>
    
    <form method="POST" novalidate>
      {% csrf_token %}
      {% include 'accounts/_form_fields.html' %}
      
      <button type="submit" class="btn btn-primary">Save Skill</button>
      <a href="{% url 'skill-list' %}" class="cancel">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
