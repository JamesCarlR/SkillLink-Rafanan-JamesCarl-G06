<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SkillLink{% endblock %}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh;display:flex;flex-direction:column}
nav{background:#1a365d;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 32px;box-shadow:0 2px 10px rgba(0,0,0,.15);flex-wrap:wrap;gap:10px}
nav .logo{font-size:1.4rem;font-weight:700;letter-spacing:.5px;color:#fff;text-decoration:none}
nav .logo span{color:#63b3ed}
nav .links{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
nav .links a,nav .links button{background:transparent;border:0;color:#cbd5e0;font:inherit;font-size:.95rem;font-weight:500;padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;transition:.2s}
nav .links a:hover,nav .links button:hover{background:rgba(255,255,255,.15);color:#fff}
nav form{display:inline}
.page{padding:40px 20px;flex:1}
.wrap{max-width:1100px;margin:0 auto}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(26,54,93,.1);padding:36px}
.auth{max-width:440px;margin:20px auto}
.auth h2{color:#1a365d;font-size:1.7rem;margin-bottom:6px}
.auth .sub{color:#64748b;margin-bottom:20px;font-size:.95rem}
.field{margin-bottom:6px}
label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px;color:#334155}
input,select,textarea{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font:inherit;background:#f8fafc;transition:.2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:#3182ce;background:#fff;box-shadow:0 0 0 3px rgba(49,130,206,.15)}
input[type=checkbox]{width:auto;margin-right:6px}
input[type=file]{background:#fff;padding:9px}
textarea{resize:vertical;min-height:100px}
.help{font-size:.78rem;color:#94a3b8;margin-top:6px;line-height:1.4}
.help ul{margin-left:18px}
.errorlist{list-style:none;color:#e53e3e;font-size:.82rem;margin-top:6px}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer;transition:.2s;text-decoration:none;text-align:center}
.btn-primary{background:#2b6cb0;color:#fff;width:100%;margin-top:22px}
.btn-primary:hover{background:#1a365d;transform:translateY(-1px)}
.btn-green{background:#38a169;color:#fff}
.btn-green:hover{background:#2f855a}
.btn-outline{display:block;width:100%;margin-top:12px;border:1.5px solid #e2e8f0;background:#fff;color:#475569}
.btn-outline:hover{background:#f8fafc;border-color:#cbd5e0}
.alt{text-align:center;margin-top:20px;font-size:.9rem;color:#64748b}
.alt a,.forgot a{color:#2b6cb0;font-weight:600;text-decoration:none}
.forgot{text-align:right;margin-top:8px;font-size:.85rem}
.cancel{display:block;text-align:center;margin-top:14px;color:#64748b;text-decoration:none;font-weight:600}
.msgs{max-width:560px;width:100%;margin:20px auto 0;padding:0 20px}
.msg{padding:12px 16px;border-radius:10px;font-size:.92rem;margin-bottom:8px;background:#ebf8ff;color:#2a4365;border:1px solid #bee3f8}
.msg.success{background:#f0fff4;color:#22543d;border-color:#c6f6d5}
.msg.error{background:#fff5f5;color:#9b2c2c;border-color:#fed7d7}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;flex-wrap:wrap;gap:12px}
.head h2{color:#1a365d;font-size:1.8rem}
.head p{color:#64748b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.skill{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 14px rgba(0,0,0,.07);display:flex;flex-direction:column;transition:.25s;border-top:4px solid #3182ce}
.skill.teach{border-top-color:#38a169}
.skill:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(0,0,0,.12)}
.badge{align-self:flex-start;font-size:.75rem;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:12px}
.teach .badge{background:#c6f6d5;color:#22543d}
.learn .badge{background:#bee3f8;color:#2a4365}
.skill h3{color:#1a365d;margin-bottom:8px}
.skill p{color:#64748b;font-size:.92rem;line-height:1.5;flex:1}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid #edf2f7;font-size:.85rem}
.user{display:flex;align-items:center;gap:8px;color:#475569}
.av{width:28px;height:28px;border-radius:50%;background:#1a365d;color:#fff;display:grid;place-items:center;font-size:.75rem;font-weight:700}
.acts a{color:#64748b;text-decoration:none;margin-left:10px}
.acts a:hover{color:#2b6cb0}.acts a.del:hover{color:#e53e3e}
.profile{max-width:440px;margin:20px auto;text-align:center}
.pic{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#2b6cb0,#63b3ed);color:#fff;font-size:2.6rem;font-weight:700;display:grid;place-items:center;margin:0 auto 16px;border:5px solid #ebf8ff}
.profile h2{color:#1a365d}
.profile .un{color:#64748b;margin-bottom:12px}
.profile .meta{color:#64748b;font-size:.9rem;margin-top:12px}
.profile .bio{color:#475569;font-size:.92rem;line-height:1.5;margin-top:8px}
.role{display:inline-block;background:#ebf8ff;color:#2b6cb0;padding:4px 14px;border-radius:20px;font-size:.8rem;font-weight:700}
.stats{display:flex;justify-content:center;gap:30px;margin:24px 0;padding:18px 0;border-top:1px solid #edf2f7;border-bottom:1px solid #edf2f7}
.stats b{display:block;font-size:1.4rem;color:#1a365d}
.stats small{color:#64748b}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin:24px 0}
.tile{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:20px;text-align:center;text-decoration:none;display:block}
.tile b{display:block;font-size:2rem;color:#2b6cb0}
.tile span{color:#64748b;font-size:.9rem}
a.tile:hover{border-color:#3182ce;box-shadow:0 4px 12px rgba(49,130,206,.15)}
@media(max-width:520px){nav{padding:12px 16px}}
</style>
</head>
<body>

<nav>
  <a class="logo" href="{% url 'accounts:home' %}">Skill<span>Link</span></a>
  <div class="links">
    {% if user.is_authenticated %}
      <a href="{% url 'accounts:dashboard' %}">Dashboard</a>
      <a href="{% url 'skill-list' %}">Skill Board</a>
      <a href="{% url 'accounts:profile' %}">Profile</a>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
      </form>
    {% else %}
      <a href="{% url 'accounts:login' %}">Login</a>
      <a href="{% url 'accounts:register' %}">Register</a>
    {% endif %}
  </div>
</nav>

{% if messages %}
<div class="msgs">
  {% for message in messages %}<div class="msg {{ message.tags }}">{{ message }}</div>{% endfor %}
</div>
{% endif %}

{% block content %}
{% endblock %}

</body>
</html>
