{% extends 'base.html' %}
{% block title %}Log in - SkillLink{% endblock %}
{% block content %}
<div class="page">
  <div class="card auth">
    <h2>Welcome back 👋</h2>
    <p class="sub">Log in to share what you know and learn what you need.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include 'accounts/_form_fields.html' %}
      <input type="hidden" name="next" value="{{ next }}">
      <p class="forgot"><a href="{% url 'password_reset' %}">Forgot password?</a></p>
      <button type="submit" class="btn btn-primary">Log In</button>
    </form>
    <p class="alt">New here? <a href="{% url 'accounts:register' %}">Create an Account</a></p>
  </div>
</div>
{% endblock %}
