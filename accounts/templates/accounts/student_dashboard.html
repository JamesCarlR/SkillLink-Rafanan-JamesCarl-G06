{% extends 'base.html' %}
{% block title %}Dashboard - SkillLink{% endblock %}
{% block content %}
<div class="page">
  <div class="wrap">
    <div class="card">
      <h2 style="color:#1a365d;margin-bottom:6px">Welcome, {{ user.first_name|default:user.username }} 👋</h2>
      <p style="color:#64748b">Share what you know, learn what you need.</p>
      <div class="tiles">
        <a class="tile" href="{% url 'skill-list' %}"><b>📚</b><span>Skill Board</span></a>
        <a class="tile" href="{% url 'skill-create' %}"><b>➕</b><span>Post a Skill</span></a>
        <a class="tile" href="{% url 'accounts:profile' %}"><b>👤</b><span>My Profile</span></a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
