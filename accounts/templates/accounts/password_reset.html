{% extends 'base.html' %}
{% block title %}Reset Password - SkillLink{% endblock %}
{% block content %}
<div class="page">
  <div class="card auth">
    <h2>Reset password</h2>
    <p class="sub">Enter your email and we'll send you a reset link.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include 'accounts/_form_fields.html' %}
      <button type="submit" class="btn btn-primary">Send Reset Link</button>
    </form>
    <p class="alt"><a href="{% url 'accounts:login' %}">Back to Log In</a></p>
  </div>
</div>
{% endblock %}
